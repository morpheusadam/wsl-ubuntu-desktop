; ============================================================================
;   UbuntuDesktop  -  configuration template
; ----------------------------------------------------------------------------
;   Copy this file to  config.ini  and fill in your own values.
;   * Lines that start with ';' or '#' are comments and are ignored.
;   * Every setting is  key=value  -> no quotes, no spaces around the '='.
;   * After editing, run UbuntuDesktop.exe, or open the Settings window with:
;         UbuntuDesktop.exe /settings
; ============================================================================


; --- user = WSL username ----------------------------------------------------
;   Your Linux username inside WSL (run  whoami  in Ubuntu to find it).
;   REQUIRED.
user=your-wsl-username


; --- pass = WSL password ----------------------------------------------------
;   Your Linux password. xrdp signs you in against the REAL Linux user, so this
;   MUST equal your Ubuntu password. Change it in Ubuntu (passwd)? Update it
;   here too, or tick "Also set this as the WSL/Linux password" in Settings.
;   Only stored when savepass=true. REQUIRED.
pass=your-wsl-password


; --- port = xrdp port -------------------------------------------------------
;   TCP port xrdp listens on in WSL. The guide uses 3390 to avoid clashing
;   with Windows' own RDP (3389). Default: 3390
port=3390


; --- distro = WSL distribution name -----------------------------------------
;   Which distro to launch. List them with  wsl -l -v. Default: Ubuntu
distro=Ubuntu


; --- savepass = remember / cache the password -------------------------------
;   true  -> save it here and in Windows Credential Manager; desktop opens
;            with no password prompt (recommended).
;   false -> wipe the credential after each connect; xrdp asks every time.
;   Default: true
savepass=true


; --- newdesktop = open on the side virtual desktop --------------------------
;   true  -> move ONE virtual desktop right (Win+Ctrl+Right) and open Ubuntu
;            there. Does NOT create a new desktop, so make sure a second one
;            already exists (Win+Tab > New desktop).
;   false -> open on the current desktop.
;   Default: false
newdesktop=false
